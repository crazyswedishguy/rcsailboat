# Seeed XIAO ESP32-S3 dual-mode LoRa bridge.
#
# Replaces the previous Ranger Micro / CRSF-UART radio link with a direct
# SX1262 LoRa link to the boat ESP32-S3.  All CRSF framing is done on the
# XIAO; the SX1262 carries raw CRSF frames as LoRa packet payloads.

[platformio]
build_dir = ${sysenv.HOME}/.cache/pio-build/crsf-bridge

[env:xiao-esp32s3]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I"${PROJECT_DIR}/../shared"

lib_deps =
    jgromes/RadioLib @ ^7.0.0
